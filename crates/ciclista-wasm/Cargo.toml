[package]
name = "ciclista-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for ciclista routing engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ciclista-core = { path = "../ciclista-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
console_error_panic_hook = "0.1"
